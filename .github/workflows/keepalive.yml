# Keeps the free Render instance awake by calling /v1/health every 5 minutes.
# Only active until KEEPALIVE_UNTIL (epoch seconds); after that each run does nothing,
# so the free instance hours are not used up. Re-arm by changing the value.
name: keep-server-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
env:
  KEEPALIVE_UNTIL: "1794924987"
  URL: https://askai-backend-r3bk.onrender.com/v1/health
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping ASKAI server
        run: |
          if [ "$(date +%s)" -gt "$KEEPALIVE_UNTIL" ]; then echo "keep-alive window over"; exit 0; fi
          curl -sS -m 150 --retry 2 --retry-delay 20 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$URL"
